services:
  - type: web
    name: safelink-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/safelink_web.db
    disk:
      name: safelink-data
      mountPath: /var/data
      sizeGB: 1
